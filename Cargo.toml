[package]
name = "tsmv"
version = "0.1.0"
edition = "2021"
description = "Safely move TypeScript files/folders and update imports"
license = "MIT"
repository = "https://github.com/anomalyco/tsmv"
rust-version = "1.75"

[[bin]]
name = "tsmv"
path = "src/main.rs"

[lib]
name = "tsmv"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "2"
glob = "0.3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
regex = "1"
pathdiff = "0.2"

# swc for AST-based import updates (Phase 3+)
# swc_core = { version = "0.10", features = [
#     "swc_ecma_parser",
#     "swc_ecma_ast",
#     "swc_ecma_visit",
#     "common",
# ], optional = true }

[features]
default = []
# Enable swc-based AST import updater (Phase 3+) — requires swc_core dependency
# swc = ["swc_core"]

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
