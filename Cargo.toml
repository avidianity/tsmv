[package]
name = "tsmv"
version = "1.0.5"
edition = "2021"
description = "Safely move TypeScript files/folders and update imports"
license = "AGPL-3.0-only"
repository = "https://github.com/avidianity/tsmv"
rust-version = "1.75"

[[bin]]
name = "tsmv"
path = "src/main.rs"

[lib]
name = "tsmv"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "2"
glob = "0.3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
pathdiff = "0.2"
# AST-based import parsing/rewriting (replaces the old regex matcher).
tree-sitter = "0.24.7"
tree-sitter-typescript = "0.23.2"

[features]
default = []

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
